name: Deploy

# Runs only after CI has passed on main (or by hand), so a red build never ships.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/saadabrar1/weatherroute
  APP_DIR: /opt/weatherroute

jobs:
  image:
    name: Publish image to GHCR
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: tag
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      # Until the server exists, skip with a notice instead of failing the run.
      - name: Check server secrets
        id: cfg
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "::notice::EC2_HOST, EC2_USER or EC2_SSH_KEY is not set; image published, deploy skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: deploy

      - name: Set up SSH
        if: steps.cfg.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host app\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n' \
            "$EC2_HOST" "$EC2_USER" > ~/.ssh/config

      - name: Copy compose and Caddy config
        if: steps.cfg.outputs.ready == 'true'
        run: scp deploy/docker-compose.prod.yml deploy/Caddyfile "app:$APP_DIR/"

      # The job's own short-lived token pulls the image, piped over stdin so it
      # never appears in a command line; the server keeps no registry login.
      - name: Pull and restart
        if: steps.cfg.outputs.ready == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2029  # $APP_DIR/$TAG are meant to expand on the runner
          printf '%s' "$GHCR_TOKEN" | ssh app "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          # Steps run with set -e; keep the status so the logout below always runs.
          status=0
          # shellcheck disable=SC2029
          ssh app "cd $APP_DIR && export IMAGE_TAG=$TAG && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d --remove-orphans" || status=$?
          ssh app "docker logout ghcr.io >/dev/null; docker image prune -f >/dev/null" || true
          exit $status

      - name: Wait for a healthy container
        if: steps.cfg.outputs.ready == 'true'
        run: |
          # shellcheck disable=SC2029  # $APP_DIR/$TAG are meant to expand on the runner
          for i in $(seq 1 30); do
            state=$(ssh app "docker inspect --format '{{.State.Health.Status}}' weatherroute-app-1" || true)
            echo "attempt $i: $state"
            [ "$state" = "healthy" ] && exit 0
            sleep 5
          done
          # shellcheck disable=SC2029
          ssh app "cd $APP_DIR && docker compose -f docker-compose.prod.yml logs --tail 80 app"
          exit 1

      - name: Public HTTPS check
        if: steps.cfg.outputs.ready == 'true'
        run: |
          # shellcheck disable=SC2029  # $APP_DIR/$TAG are meant to expand on the runner
          domain=$(ssh app "grep '^DOMAIN=' $APP_DIR/.env | cut -d= -f2")
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://$domain/api/health"
          echo "::notice::Deployed $TAG to https://$domain"
