# Production stack on the EC2 host, started by the Deploy workflow.
# Caddy terminates HTTPS (automatic Let's Encrypt) and proxies to the app.
name: weatherroute

services:
  app:
    image: ghcr.io/saadabrar1/weatherroute:${IMAGE_TAG:-latest}
    env_file: .env
    restart: unless-stopped
    expose:
      - "8000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.8-alpine
    env_file: .env
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
